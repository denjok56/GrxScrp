name: Build Quest3 V3 APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Patch Quest 3 renderer
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/pages/FullscreenControlScreen.kt"
          )

          s = p.read_text(encoding="utf-8")

          # Add graphics transform import
          anchor = "import androidx.compose.ui.geometry.Offset\n"

          if "import androidx.compose.ui.graphics.graphicsLayer\n" not in s:
              if anchor not in s:
                  raise SystemExit("IMPORT ANCHOR NOT FOUND")

              s = s.replace(
                  anchor,
                  anchor + "import androidx.compose.ui.graphics.graphicsLayer\n",
                  1
              )

          # Exact block from current upstream
          old = """            ScrcpyVideoSurface(
                  modifier = Modifier
                      .fillMaxSize()
                      .onGloballyPositioned { coordinates ->
                          val bounds = coordinates.boundsInWindow()
                          onVideoBoundsInWindowChanged(
                              Rect(
                                  bounds.left.toInt(),
                                  bounds.top.toInt(),
                                  bounds.right.toInt(),
                                  bounds.bottom.toInt(),
                              ),
                          )
                      },"""

          new = """            ScrcpyVideoSurface(
                  modifier = Modifier
                      .fillMaxSize()
                      .graphicsLayer {
                          // Quest 3 eye correction.
                          // Keep full framebuffer on Quest:
                          // no server-side crop = no crop flicker.
                          rotationZ = -22f

                          // Scale full stereo frame so the right eye fills
                          // most of the viewport. Translation shifts
                          // the right half into view.
                          scaleX = 1.75f
                          scaleY = 1.75f
                          translationX = -size.width * 0.44f
                      }
                      .onGloballyPositioned { coordinates ->
                          val bounds = coordinates.boundsInWindow()
                          onVideoBoundsInWindowChanged(
                              Rect(
                                  bounds.left.toInt(),
                                  bounds.top.toInt(),
                                  bounds.right.toInt(),
                                  bounds.bottom.toInt(),
                              ),
                          )
                      },"""

          if old not in s:
              raise SystemExit("CURRENT VIDEO BLOCK NOT FOUND")

          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

          print("QUEST3 V3 PATCH APPLIED")
          print("server crop: OFF")
          print("rotation: -22")
          print("client scale: 1.75")
          print("right-eye translation enabled")

      - name: Verify patch
        run: |
          FILE="app/src/main/java/io/github/miuzarte/scrcpyforandroid/pages/FullscreenControlScreen.kt"

          grep -n "rotationZ = -22f" "$FILE"
          grep -n "scaleX = 1.75f" "$FILE"
          grep -n "translationX = -size.width" "$FILE"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK="$(find app/build/outputs -type f -name "*debug*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp "$APK" Quest3-ScrcpyForAndroid-V3.apk

          ls -lh Quest3-ScrcpyForAndroid-V3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-ScrcpyForAndroid-V3
          path: Quest3-ScrcpyForAndroid-V3.apk
          if-no-files-found: error
