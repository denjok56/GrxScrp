name: Build Quest3 V2 APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Patch Quest 3 renderer
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/pages/FullscreenControlScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          # Imports
          anchor = "import androidx.compose.ui.geometry.Offset"

          if "import androidx.compose.ui.draw.clipToBounds" not in text:
              text = text.replace(
                  anchor,
                  anchor
                  + "\nimport androidx.compose.ui.draw.clipToBounds"
                  + "\nimport androidx.compose.ui.graphics.graphicsLayer",
                  1
              )

          # Verified against current upstream source.
          start_marker = "        val sessionAspect ="
          end_marker = "        if (showDebugInfo) Box("

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start < 0:
              raise SystemExit("START MARKER NOT FOUND")

          if end < 0:
              raise SystemExit("END MARKER NOT FOUND")

          lines = [
              "        // Quest 3 local rendering preset",
              "        // Full 4128x2208 stream stays on Quest.",
              "        // Right eye is selected locally on Android.",
              "",
              "        val questEyeAspect = 2064f / 2208f",
              "",
              "        Box(",
              "            modifier = Modifier",
              "                .fillMaxSize()",
              "                .clipToBounds(),",
              "            contentAlignment = Alignment.Center,",
              "        ) {",
              "",
              "            Box(",
              "                modifier = Modifier",
              "                    .fillMaxHeight(0.92f)",
              "                    .aspectRatio(questEyeAspect)",
              "                    .clipToBounds()",
              "                    .graphicsLayer {",
              "                        rotationZ = -22f",
              "                    },",
              "                contentAlignment = Alignment.CenterEnd,",
              "            ) {",
              "",
              "                ScrcpyVideoSurface(",
              "                    modifier = Modifier",
              "                        .requiredWidth(maxWidth * 2)",
              "                        .fillMaxHeight()",
              "                        .onGloballyPositioned { coordinates ->",
              "                            val bounds = coordinates.boundsInWindow()",
              "                            onVideoBoundsInWindowChanged(",
              "                                Rect(",
              "                                    bounds.left.toInt(),",
              "                                    bounds.top.toInt(),",
              "                                    bounds.right.toInt(),",
              "                                    bounds.bottom.toInt(),",
              "                                ),",
              "                            )",
              "                        },",
              "                    session = session,",
              "                    imeRequestToken = imeRequestToken,",
              "                    onImeCommitText = onImeCommitText,",
              "                    onImeDeleteSurroundingText = { beforeLength, afterLength ->",
              "                        submitImeDeleteSurroundingText(",
              "                            scrcpy = scrcpy,",
              "                            beforeLength = beforeLength,",
              "                            afterLength = afterLength,",
              "                        )",
              "                    },",
              "                    onImeKeyEvent = { event ->",
              "                        submitImeKeyEvent(",
              "                            scrcpy = scrcpy,",
              "                            event = event,",
              "                            keyInjectMode = session.keyInjectMode,",
              "                            forwardKeyRepeat = session.forwardKeyRepeat,",
              "                        )",
              "                    },",
              "                )",
              "            }",
              "        }",
              ""
          ]

          replacement = "\n".join(lines)

          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding="utf-8")

          print("PATCH OK")
          print("Right eye")
          print("Local crop")
          print("Rotation -22")
          print("No server crop")

      - name: Verify patch
        run: |
          FILE="app/src/main/java/io/github/miuzarte/scrcpyforandroid/pages/FullscreenControlScreen.kt"

          grep -n "Quest 3 local rendering preset" "$FILE"
          grep -n "rotationZ = -22f" "$FILE"
          grep -n "requiredWidth(maxWidth \* 2)" "$FILE"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          echo "Searching APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK="$(find app/build/outputs -type f -name "*debug*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp "$APK" Quest3-ScrcpyForAndroid-V2.apk

          ls -lh Quest3-ScrcpyForAndroid-V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-ScrcpyForAndroid-V2
          path: Quest3-ScrcpyForAndroid-V2.apk
          if-no-files-found: error
