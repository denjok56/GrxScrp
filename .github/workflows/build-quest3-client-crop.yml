name: Inspect Quest3 Renderer Source

"on":
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Show FullscreenControlScreen
        run: |
          echo "===== FILE START ====="
          nl -ba app/src/main/java/io/github/miuzarte/scrcpyforandroid/pages/FullscreenControlScreen.kt
          echo "===== FILE END ====="

      - name: Stop intentionally
        run: |
          echo "Inspection complete"
          exit 1
