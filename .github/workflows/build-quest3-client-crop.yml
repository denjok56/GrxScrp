name: Build Quest3 Client Crop APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Patch Quest 3 renderer
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/pages/FullscreenControlScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          # Imports needed for local clipping + rotation.
          import_anchor = "import androidx.compose.ui.geometry.Offset"

          if "import androidx.compose.ui.draw.clipToBounds" not in text:
              if import_anchor not in text:
                  raise SystemExit("Import anchor not found")

              text = text.replace(
                  import_anchor,
                  import_anchor
                  + "\nimport androidx.compose.ui.draw.clipToBounds"
                  + "\nimport androidx.compose.ui.graphics.graphicsLayer",
                  1
              )

          # Exact current video block.
          start_marker = "        val sessionAspect ="
          end_marker = "        if (showDebugInfo) Box("

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1:
              raise SystemExit("Video block start not found")

          if end == -1:
              raise SystemExit("Video block end not found")

          replacement_lines = [
              "        // Quest 3 LOCAL right-eye crop.",
              "        // Quest still sends full 4128x2208 framebuffer.",
              "        // Crop and rotation happen only on this Android device.",
              "        // This avoids Quest/Horizon server-side crop flicker.",
              "        val questEyeAspect = 2064f / 2208f",
              "",
              "        Box(",
              "            modifier = Modifier",
              "                .fillMaxSize()",
              "                .clipToBounds(),",
              "            contentAlignment = Alignment.Center,",
              "        ) {",
              "            Box(",
              "                modifier = Modifier",
              "                    .fillMaxHeight(0.94f)",
              "                    .aspectRatio(questEyeAspect)",
              "                    .graphicsLayer {",
              "                        rotationZ = -22f",
              "                        scaleX = 0.78f",
              "                        scaleY = 0.78f",
              "                    }",
              "                    .clipToBounds(),",
              "                contentAlignment = Alignment.CenterEnd,",
              "            ) {",
              "                ScrcpyVideoSurface(",
              "                    modifier = Modifier",
              "                        .requiredWidth(maxWidth * 2)",
              "                        .fillMaxHeight()",
              "                        .onGloballyPositioned { coordinates ->",
              "                            val bounds = coordinates.boundsInWindow()",
              "                            onVideoBoundsInWindowChanged(",
              "                                Rect(",
              "                                    bounds.left.toInt(),",
              "                                    bounds.top.toInt(),",
              "                                    bounds.right.toInt(),",
              "                                    bounds.bottom.toInt(),",
              "                                ),",
              "                            )",
              "                        },",
              "                    session = session,",
              "                    imeRequestToken = imeRequestToken,",
              "                    onImeCommitText = onImeCommitText,",
              "                    onImeDeleteSurroundingText = { beforeLength, afterLength ->",
              "                        submitImeDeleteSurroundingText(",
              "                            scrcpy = scrcpy,",
              "                            beforeLength = beforeLength,",
              "                            afterLength = afterLength,",
              "                        )",
              "                    },",
              "                    onImeKeyEvent = { event ->",
              "                        submitImeKeyEvent(",
              "                            scrcpy = scrcpy,",
              "                            event = event,",
              "                            keyInjectMode = session.keyInjectMode,",
              "                            forwardKeyRepeat = session.forwardKeyRepeat,",
              "                        )",
              "                    },",
              "                )",
              "            }",
              "        }",
              ""
          ]

          replacement = "\n".join(replacement_lines)

          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding="utf-8")

          print("Quest 3 renderer patch applied")
          print("Input: full 4128x2208")
          print("Eye: RIGHT")
          print("Crop location: Android client")
          print("Rotation: -22 degrees")
          print("Server-side crop: DISABLED")

      - name: Verify patch
        run: |
          FILE="app/src/main/java/io/github/miuzarte/scrcpyforandroid/pages/FullscreenControlScreen.kt"

          grep -n "Quest 3 LOCAL right-eye crop" "$FILE"
          grep -n "rotationZ = -22f" "$FILE"
          grep -n "requiredWidth(maxWidth \* 2)" "$FILE"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Find APK
        run: |
          echo "Available APKs:"
          find . -type f -name "*.apk" -print

          APK="$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Debug APK not found"
            exit 1
          fi

          cp "$APK" Quest3-ScrcpyForAndroid.apk
          ls -lh Quest3-ScrcpyForAndroid.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-ScrcpyForAndroid-APK
          path: Quest3-ScrcpyForAndroid.apk
          if-no-files-found: error
