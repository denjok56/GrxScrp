name: Build Quest3 V5 TextureView APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Replace SurfaceView with TextureView
        run: |
          cat > app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt <<'KOTLIN'
          package io.github.miuzarte.scrcpyforandroid.widgets

          import android.content.Context
          import android.graphics.Matrix
          import android.text.InputType
          import android.util.AttributeSet
          import android.view.KeyEvent
          import android.view.TextureView
          import android.view.inputmethod.BaseInputConnection
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputConnection

          class ScrcpyInputSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0,
          ): TextureView(context, attrs, defStyleAttr) {

              interface InputCallbacks {
                  fun handleKeyEvent(event: KeyEvent): Boolean
                  fun handleCommitText(text: CharSequence): Boolean
                  fun handleDeleteSurroundingText(
                      beforeLength: Int,
                      afterLength: Int,
                  ): Boolean
              }

              var inputCallbacks: InputCallbacks? = null
              private var commitTextEnabled = false

              fun setCommitTextEnabled(enabled: Boolean) {
                  commitTextEnabled = enabled
                  isFocusable = enabled
                  isFocusableInTouchMode = enabled

                  if (enabled) {
                      requestFocus()
                  } else {
                      clearFocus()
                  }
              }

              /*
               * Quest 3 sends 4128x2208:
               *
               *   [ LEFT 2064 ][ RIGHT 2064 ]
               *
               * The TextureView is sized approximately like one eye.
               *
               * 1. Horizontal scale x2 selects the RIGHT half.
               * 2. Extra 1.18 zoom hides black corners after rotation.
               * 3. -22 degrees compensates Quest eye tilt.
               *
               * All of this happens AFTER decoding on the phone.
               * Nothing is cropped on Quest.
               */
              fun applyQuest3Transform() {
                  if (width <= 0 || height <= 0) return

                  val cx = width / 2f
                  val cy = height / 2f

                  val matrix = Matrix()

                  // Pick right half of full stereo framebuffer.
                  // Pivot on right edge so x = width/2 becomes x = 0.
                  matrix.setScale(
                      2.0f,
                      1.0f,
                      width.toFloat(),
                      cy,
                  )

                  // Fill corners after rotation.
                  matrix.postScale(
                      1.18f,
                      1.18f,
                      cx,
                      cy,
                  )

                  // Quest 3 eye tilt correction.
                  matrix.postRotate(
                      -22.0f,
                      cx,
                      cy,
                  )

                  setTransform(matrix)
              }

              override fun onSizeChanged(
                  w: Int,
                  h: Int,
                  oldw: Int,
                  oldh: Int,
              ) {
                  super.onSizeChanged(w, h, oldw, oldh)

                  if (w > 0 && h > 0) {
                      post {
                          applyQuest3Transform()
                      }
                  }
              }

              override fun onCheckIsTextEditor(): Boolean {
                  return commitTextEnabled || super.onCheckIsTextEditor()
              }

              override fun onKeyPreIme(
                  keyCode: Int,
                  event: KeyEvent,
              ): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      return super.onKeyPreIme(keyCode, event)
                  }

                  if (inputCallbacks?.handleKeyEvent(event) == true) {
                      return true
                  }

                  return super.onKeyPreIme(keyCode, event)
              }

              override fun onCreateInputConnection(
                  outAttrs: EditorInfo,
              ): InputConnection? {
                  if (!commitTextEnabled) {
                      return super.onCreateInputConnection(outAttrs)
                  }

                  outAttrs.inputType = InputType.TYPE_CLASS_TEXT
                  outAttrs.imeOptions = EditorInfo.IME_FLAG_NO_EXTRACT_UI

                  return object: BaseInputConnection(this, false) {

                      override fun commitText(
                          text: CharSequence,
                          newCursorPosition: Int,
                      ): Boolean {
                          if (inputCallbacks?.handleCommitText(text) == true) {
                              return true
                          }

                          return super.commitText(
                              text,
                              newCursorPosition,
                          )
                      }

                      override fun deleteSurroundingText(
                          beforeLength: Int,
                          afterLength: Int,
                      ): Boolean {
                          if (
                              inputCallbacks?.handleDeleteSurroundingText(
                                  beforeLength,
                                  afterLength,
                              ) == true
                          ) {
                              return true
                          }

                          return super.deleteSurroundingText(
                              beforeLength,
                              afterLength,
                          )
                      }

                      override fun sendKeyEvent(
                          event: KeyEvent,
                      ): Boolean {
                          if (event.keyCode == KeyEvent.KEYCODE_BACK) {
                              return super.sendKeyEvent(event)
                          }

                          if (inputCallbacks?.handleKeyEvent(event) == true) {
                              return true
                          }

                          return super.sendKeyEvent(event)
                      }
                  }
              }
          }
          KOTLIN

      - name: Patch video output to TextureView
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/widgets/DeviceWidgets.kt"
          )

          s = p.read_text(encoding="utf-8")

          # SurfaceHolder is no longer used.
          s = s.replace(
              "import android.view.SurfaceHolder",
              "import android.graphics.SurfaceTexture\n"
              "import android.view.TextureView",
              1,
          )

          start_marker = "@Composable\nfun ScrcpyVideoSurface("
          end_marker = "\n@Composable\ninternal fun DeviceTile("

          start = s.find(start_marker)
          end = s.find(end_marker, start)

          if start < 0:
              raise SystemExit(
                  "ScrcpyVideoSurface start not found"
              )

          if end < 0:
              raise SystemExit(
                  "ScrcpyVideoSurface end not found"
              )

          lines = [
              "@Composable",
              "fun ScrcpyVideoSurface(",
              "    modifier: Modifier,",
              "    session: Scrcpy.Session.SessionInfo?,",
              "    imeRequestToken: Int = 0,",
              "    onImeCommitText: (suspend (String) -> Unit)? = null,",
              "    onImeDeleteSurroundingText: (suspend (beforeLength: Int, afterLength: Int) -> Unit)? = null,",
              "    onImeKeyEvent: (suspend (KeyEvent) -> Boolean)? = null,",
              ") {",
              "    val taskScope = remember { CoroutineScope(SupervisorJob() + Dispatchers.IO) }",
              "    val scope = rememberCoroutineScope()",
              "    val imeInputMutex = remember { Mutex() }",
              "    val lifecycleOwner = LocalLifecycleOwner.current",
              "",
              "    var currentSurface by remember { mutableStateOf<Surface?>(null) }",
              "    var currentTextureView by remember { mutableStateOf<ScrcpyInputSurfaceView?>(null) }",
              "",
              "    val latestSession by rememberUpdatedState(session)",
              "",
              "    fun configureTexture(view: ScrcpyInputSurfaceView) {",
              "        val info = latestSession",
              "        val texture = view.surfaceTexture",
              "",
              "        if (",
              "            info != null &&",
              "            texture != null &&",
              "            info.width > 0 &&",
              "            info.height > 0",
              "        ) {",
              "            texture.setDefaultBufferSize(",
              "                info.width,",
              "                info.height,",
              "            )",
              "        }",
              "",
              "        view.applyQuest3Transform()",
              "    }",
              "",
              "    LaunchedEffect(session, currentSurface) {",
              "        val surface = currentSurface ?: return@LaunchedEffect",
              "",
              "        if (session != null && surface.isValid) {",
              "            NativeCoreFacade.attachVideoSurface(surface)",
              "        }",
              "    }",
              "",
              "    LaunchedEffect(",
              "        session?.width,",
              "        session?.height,",
              "        currentTextureView,",
              "    ) {",
              "        currentTextureView?.let {",
              "            configureTexture(it)",
              "        }",
              "    }",
              "",
              "    LaunchedEffect(",
              "        imeRequestToken,",
              "        currentTextureView,",
              "    ) {",
              "        if (imeRequestToken == 0) return@LaunchedEffect",
              "",
              "        val view =",
              "            currentTextureView ?: return@LaunchedEffect",
              "",
              "        view.setCommitTextEnabled(true)",
              "        LocalInputService.showSoftKeyboard(view)",
              "    }",
              "",
              "    DisposableEffect(",
              "        lifecycleOwner,",
              "        session,",
              "        currentSurface,",
              "    ) {",
              "        val observer = LifecycleEventObserver { _, event ->",
              "            if (event == Lifecycle.Event.ON_START) {",
              "                val surface = currentSurface",
              "",
              "                if (",
              "                    session != null &&",
              "                    surface != null &&",
              "                    surface.isValid",
              "                ) {",
              "                    scope.launch {",
              "                        NativeCoreFacade.attachVideoSurface(",
              "                            surface",
              "                        )",
              "                    }",
              "                }",
              "            }",
              "        }",
              "",
              "        lifecycleOwner.lifecycle.addObserver(observer)",
              "",
              "        onDispose {",
              "            lifecycleOwner.lifecycle.removeObserver(",
              "                observer",
              "            )",
              "        }",
              "    }",
              "",
              "    DisposableEffect(Unit) {",
              "        onDispose {",
              "            val surface = currentSurface",
              "",
              "            if (surface != null) {",
              "                taskScope.launch {",
              "                    NativeCoreFacade.detachVideoSurface(",
              "                        surface",
              "                    )",
              "                    surface.release()",
              "                }",
              "            }",
              "        }",
              "    }",
              "",
              "    AndroidView(",
              "        modifier = modifier,",
              "        factory = { context ->",
              "            ScrcpyInputSurfaceView(context).apply {",
              "                currentTextureView = this",
              "",
              "                inputCallbacks =",
              "                    object: ScrcpyInputSurfaceView.InputCallbacks {",
              "",
              "                        override fun handleKeyEvent(",
              "                            event: KeyEvent,",
              "                        ): Boolean {",
              "                            val handler =",
              "                                onImeKeyEvent ?: return false",
              "",
              "                            taskScope.launch {",
              "                                imeInputMutex.withLock {",
              "                                    handler(event)",
              "                                }",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "",
              "                        override fun handleCommitText(",
              "                            text: CharSequence,",
              "                        ): Boolean {",
              "                            val handler =",
              "                                onImeCommitText ?: return false",
              "",
              "                            taskScope.launch {",
              "                                imeInputMutex.withLock {",
              "                                    handler(text.toString())",
              "                                }",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "",
              "                        override fun handleDeleteSurroundingText(",
              "                            beforeLength: Int,",
              "                            afterLength: Int,",
              "                        ): Boolean {",
              "                            val handler =",
              "                                onImeDeleteSurroundingText",
              "                                    ?: return false",
              "",
              "                            taskScope.launch {",
              "                                imeInputMutex.withLock {",
              "                                    handler(",
              "                                        beforeLength,",
              "                                        afterLength,",
              "                                    )",
              "                                }",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "                    }",
              "",
              "                surfaceTextureListener =",
              "                    object: TextureView.SurfaceTextureListener {",
              "",
              "                        override fun onSurfaceTextureAvailable(",
              "                            surfaceTexture: SurfaceTexture,",
              "                            width: Int,",
              "                            height: Int,",
              "                        ) {",
              "                            latestSession?.let { info ->",
              "                                if (",
              "                                    info.width > 0 &&",
              "                                    info.height > 0",
              "                                ) {",
              "                                    surfaceTexture.setDefaultBufferSize(",
              "                                        info.width,",
              "                                        info.height,",
              "                                    )",
              "                                }",
              "                            }",
              "",
              "                            applyQuest3Transform()",
              "",
              "                            val newSurface =",
              "                                Surface(surfaceTexture)",
              "",
              "                            currentSurface = newSurface",
              "",
              "                            if (latestSession != null) {",
              "                                scope.launch {",
              "                                    NativeCoreFacade.attachVideoSurface(",
              "                                        newSurface",
              "                                    )",
              "                                }",
              "                            }",
              "                        }",
              "",
              "                        override fun onSurfaceTextureSizeChanged(",
              "                            surfaceTexture: SurfaceTexture,",
              "                            width: Int,",
              "                            height: Int,",
              "                        ) {",
              "                            applyQuest3Transform()",
              "                        }",
              "",
              "                        override fun onSurfaceTextureDestroyed(",
              "                            surfaceTexture: SurfaceTexture,",
              "                        ): Boolean {",
              "                            val surface = currentSurface",
              "",
              "                            if (surface != null) {",
              "                                taskScope.launch {",
              "                                    NativeCoreFacade.detachVideoSurface(",
              "                                        surface",
              "                                    )",
              "                                    surface.release()",
              "                                }",
              "",
              "                                currentSurface = null",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "",
              "                        override fun onSurfaceTextureUpdated(",
              "                            surfaceTexture: SurfaceTexture,",
              "                        ) = Unit",
              "                    }",
              "            }",
              "        },",
              "        update = { view ->",
              "            configureTexture(view)",
              "        },",
              "    )",
              "}",
          ]

          replacement = "\n".join(lines)

          s = s[:start] + replacement + s[end:]

          p.write_text(s, encoding="utf-8")

          print("TextureView renderer installed")

      - name: Patch Quest 3 aspect ratios
        shell: python
        run: |
          from pathlib import Path

          # Fullscreen
          p = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/pages/FullscreenControlScreen.kt"
          )

          s = p.read_text(encoding="utf-8")

          old = """        val sessionAspect =
              if (session.height == 0) 16f / 9f
              else session.width.toFloat() / session.height.toFloat()"""

          if old not in s:
              raise SystemExit(
                  "Fullscreen sessionAspect block not found"
              )

          s = s.replace(
              old,
              "        val sessionAspect = 2064f / 2208f",
              1,
          )

          p.write_text(s, encoding="utf-8")

          # Device-page preview
          p = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/widgets/DeviceWidgets.kt"
          )

          s = p.read_text(encoding="utf-8")

          old = """                val sessionAspect =
                      if (sessionInfo == null || sessionInfo.height == 0)
                          16f / 9f
                      else sessionInfo.width.toFloat() / sessionInfo.height.toFloat()"""

          if old not in s:
              raise SystemExit(
                  "Preview sessionAspect block not found"
              )

          s = s.replace(
              old,
              "                val sessionAspect = 2064f / 2208f",
              1,
          )

          p.write_text(s, encoding="utf-8")

          print("Quest eye aspect applied")

      - name: Verify real TextureView patch
        run: |
          echo "=== ScrcpyInputSurfaceView ==="
          grep -n "TextureView" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt

          grep -n "applyQuest3Transform" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt

          echo "=== DeviceWidgets ==="
          grep -n "SurfaceTextureListener" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/DeviceWidgets.kt

          echo "=== Fullscreen aspect ==="
          grep -n "2064f / 2208f" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/pages/FullscreenControlScreen.kt

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          echo "Searching APK..."

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs \
              -type f \
              -name "*debug*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp \
            "$APK" \
            Quest3-ScrcpyForAndroid-V5-TextureView.apk

          ls -lh \
            Quest3-ScrcpyForAndroid-V5-TextureView.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-ScrcpyForAndroid-V5-TextureView
          path: Quest3-ScrcpyForAndroid-V5-TextureView.apk
          if-no-files-found: error
