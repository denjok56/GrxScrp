name: Build Quest3 V5.2 TextureView APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Replace SurfaceView with TextureView
        run: |
          cat > app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt <<'KOTLIN'
          package io.github.miuzarte.scrcpyforandroid.widgets

          import android.content.Context
          import android.graphics.Matrix
          import android.text.InputType
          import android.util.AttributeSet
          import android.view.KeyEvent
          import android.view.TextureView
          import android.view.inputmethod.BaseInputConnection
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputConnection

          class ScrcpyInputSurfaceView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0,
          ): TextureView(context, attrs, defStyleAttr) {

              interface InputCallbacks {
                  fun handleKeyEvent(event: KeyEvent): Boolean
                  fun handleCommitText(text: CharSequence): Boolean

                  fun handleDeleteSurroundingText(
                      beforeLength: Int,
                      afterLength: Int,
                  ): Boolean
              }

              var inputCallbacks: InputCallbacks? = null

              private var commitTextEnabled = false

              fun setCommitTextEnabled(enabled: Boolean) {
                  commitTextEnabled = enabled
                  isFocusable = enabled
                  isFocusableInTouchMode = enabled

                  if (enabled) {
                      requestFocus()
                  } else {
                      clearFocus()
                  }
              }

              fun applyQuest3Transform() {
                  if (width <= 0 || height <= 0) {
                      return
                  }

                  val viewWidth = width.toFloat()
                  val viewHeight = height.toFloat()

                  // Quest 3 full framebuffer:
                  // 4128 x 2208
                  //
                  // LEFT eye:
                  // 2064 x 2208
                  //
                  // RIGHT eye:
                  // 2064 x 2208
                  //
                  // We keep the full framebuffer on Quest
                  // and select the RIGHT eye locally.

                  val eyeAspect = 2064f / 2208f
                  val viewAspect = viewWidth / viewHeight

                  val matrix = Matrix()

                  /*
                   * Full input:
                   *
                   * +-------------+-------------+
                   * |  LEFT EYE   |  RIGHT EYE  |
                   * +-------------+-------------+
                   *
                   * Scaling X by 2 around the RIGHT edge
                   * moves the right half into the full TextureView.
                   */
                  matrix.setScale(
                      2f,
                      1f,
                      viewWidth,
                      viewHeight / 2f,
                  )

                  /*
                   * Preserve the aspect ratio of one Quest eye.
                   *
                   * This compensates for the fact that the
                   * Compose container may be wider/taller
                   * than 2064:2208.
                   */
                  if (viewAspect > eyeAspect) {
                      val scaleY =
                          viewAspect / eyeAspect

                      matrix.postScale(
                          1f,
                          scaleY,
                          viewWidth / 2f,
                          viewHeight / 2f,
                      )
                  } else {
                      val scaleX =
                          eyeAspect / viewAspect

                      matrix.postScale(
                          scaleX,
                          1f,
                          viewWidth / 2f,
                          viewHeight / 2f,
                      )
                  }

                  setTransform(matrix)
              }

              override fun onSizeChanged(
                  w: Int,
                  h: Int,
                  oldw: Int,
                  oldh: Int,
              ) {
                  super.onSizeChanged(
                      w,
                      h,
                      oldw,
                      oldh,
                  )

                  if (w > 0 && h > 0) {
                      post {
                          applyQuest3Transform()
                      }
                  }
              }

              override fun onCheckIsTextEditor(): Boolean {
                  return commitTextEnabled ||
                      super.onCheckIsTextEditor()
              }

              override fun onKeyPreIme(
                  keyCode: Int,
                  event: KeyEvent,
              ): Boolean {

                  if (
                      keyCode ==
                      KeyEvent.KEYCODE_BACK
                  ) {
                      return super.onKeyPreIme(
                          keyCode,
                          event,
                      )
                  }

                  if (
                      inputCallbacks
                          ?.handleKeyEvent(event) == true
                  ) {
                      return true
                  }

                  return super.onKeyPreIme(
                      keyCode,
                      event,
                  )
              }

              override fun onCreateInputConnection(
                  outAttrs: EditorInfo,
              ): InputConnection? {

                  if (!commitTextEnabled) {
                      return super
                          .onCreateInputConnection(
                              outAttrs
                          )
                  }

                  outAttrs.inputType =
                      InputType.TYPE_CLASS_TEXT

                  outAttrs.imeOptions =
                      EditorInfo
                          .IME_FLAG_NO_EXTRACT_UI

                  return object:
                      BaseInputConnection(
                          this,
                          false,
                      ) {

                      override fun commitText(
                          text: CharSequence,
                          newCursorPosition: Int,
                      ): Boolean {

                          if (
                              inputCallbacks
                                  ?.handleCommitText(
                                      text
                                  ) == true
                          ) {
                              return true
                          }

                          return super.commitText(
                              text,
                              newCursorPosition,
                          )
                      }

                      override fun deleteSurroundingText(
                          beforeLength: Int,
                          afterLength: Int,
                      ): Boolean {

                          if (
                              inputCallbacks
                                  ?.handleDeleteSurroundingText(
                                      beforeLength,
                                      afterLength,
                                  ) == true
                          ) {
                              return true
                          }

                          return super
                              .deleteSurroundingText(
                                  beforeLength,
                                  afterLength,
                              )
                      }

                      override fun sendKeyEvent(
                          event: KeyEvent,
                      ): Boolean {

                          if (
                              event.keyCode ==
                              KeyEvent.KEYCODE_BACK
                          ) {
                              return super
                                  .sendKeyEvent(event)
                          }

                          if (
                              inputCallbacks
                                  ?.handleKeyEvent(
                                      event
                                  ) == true
                          ) {
                              return true
                          }

                          return super
                              .sendKeyEvent(event)
                      }
                  }
              }
          }
          KOTLIN

      - name: Patch video output to TextureView
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "app/src/main/java/io/github/miuzarte/"
              "scrcpyforandroid/widgets/DeviceWidgets.kt"
          )

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "import android.view.SurfaceHolder",
              "import android.graphics.SurfaceTexture\n"
              "import android.view.TextureView",
              1,
          )

          start_marker = (
              "@Composable\n"
              "fun ScrcpyVideoSurface("
          )

          end_marker = (
              "\n@Composable\n"
              "internal fun DeviceTile("
          )

          start = s.find(start_marker)
          end = s.find(end_marker, start)

          if start < 0:
              raise SystemExit(
                  "ScrcpyVideoSurface start not found"
              )

          if end < 0:
              raise SystemExit(
                  "ScrcpyVideoSurface end not found"
              )

          lines = [
              "@Composable",
              "fun ScrcpyVideoSurface(",
              "    modifier: Modifier,",
              "    session: Scrcpy.Session.SessionInfo?,",
              "    imeRequestToken: Int = 0,",
              "    onImeCommitText: (suspend (String) -> Unit)? = null,",
              "    onImeDeleteSurroundingText: (suspend (beforeLength: Int, afterLength: Int) -> Unit)? = null,",
              "    onImeKeyEvent: (suspend (KeyEvent) -> Boolean)? = null,",
              ") {",
              "    val taskScope = remember { CoroutineScope(SupervisorJob() + Dispatchers.IO) }",
              "    val scope = rememberCoroutineScope()",
              "    val imeInputMutex = remember { Mutex() }",
              "    val lifecycleOwner = LocalLifecycleOwner.current",
              "",
              "    var currentSurface by remember {",
              "        mutableStateOf<Surface?>(null)",
              "    }",
              "",
              "    var currentTextureView by remember {",
              "        mutableStateOf<ScrcpyInputSurfaceView?>(null)",
              "    }",
              "",
              "    val latestSession by rememberUpdatedState(session)",
              "",
              "    fun configureTexture(",
              "        view: ScrcpyInputSurfaceView",
              "    ) {",
              "        val info = latestSession",
              "        val texture = view.surfaceTexture",
              "",
              "        if (",
              "            info != null &&",
              "            texture != null &&",
              "            info.width > 0 &&",
              "            info.height > 0",
              "        ) {",
              "            texture.setDefaultBufferSize(",
              "                info.width,",
              "                info.height,",
              "            )",
              "        }",
              "",
              "        view.applyQuest3Transform()",
              "    }",
              "",
              "    LaunchedEffect(",
              "        session,",
              "        currentSurface,",
              "    ) {",
              "        val surface =",
              "            currentSurface",
              "                ?: return@LaunchedEffect",
              "",
              "        if (",
              "            session != null &&",
              "            surface.isValid",
              "        ) {",
              "            NativeCoreFacade",
              "                .attachVideoSurface(",
              "                    surface",
              "                )",
              "        }",
              "    }",
              "",
              "    LaunchedEffect(",
              "        session?.width,",
              "        session?.height,",
              "        currentTextureView,",
              "    ) {",
              "        currentTextureView",
              "            ?.let { view ->",
              "                configureTexture(view)",
              "            }",
              "    }",
              "",
              "    LaunchedEffect(",
              "        imeRequestToken,",
              "        currentTextureView,",
              "    ) {",
              "        if (imeRequestToken == 0) {",
              "            return@LaunchedEffect",
              "        }",
              "",
              "        val view =",
              "            currentTextureView",
              "                ?: return@LaunchedEffect",
              "",
              "        view.setCommitTextEnabled(true)",
              "",
              "        LocalInputService",
              "            .showSoftKeyboard(view)",
              "    }",
              "",
              "    DisposableEffect(",
              "        lifecycleOwner,",
              "        session,",
              "        currentSurface,",
              "    ) {",
              "        val observer =",
              "            LifecycleEventObserver { _, event ->",
              "",
              "                if (",
              "                    event ==",
              "                    Lifecycle.Event.ON_START",
              "                ) {",
              "                    val surface =",
              "                        currentSurface",
              "",
              "                    if (",
              "                        session != null &&",
              "                        surface != null &&",
              "                        surface.isValid",
              "                    ) {",
              "                        scope.launch {",
              "                            NativeCoreFacade",
              "                                .attachVideoSurface(",
              "                                    surface",
              "                                )",
              "                        }",
              "                    }",
              "                }",
              "            }",
              "",
              "        lifecycleOwner.lifecycle",
              "            .addObserver(observer)",
              "",
              "        onDispose {",
              "            lifecycleOwner.lifecycle",
              "                .removeObserver(observer)",
              "        }",
              "    }",
              "",
              "    DisposableEffect(Unit) {",
              "        onDispose {",
              "            val surface =",
              "                currentSurface",
              "",
              "            if (surface != null) {",
              "                taskScope.launch {",
              "                    NativeCoreFacade",
              "                        .detachVideoSurface(",
              "                            surface",
              "                        )",
              "",
              "                    surface.release()",
              "                }",
              "            }",
              "        }",
              "    }",
              "",
              "    AndroidView(",
              "        modifier = modifier,",
              "",
              "        factory = { context ->",
              "            ScrcpyInputSurfaceView(",
              "                context",
              "            ).apply {",
              "",
              "                currentTextureView = this",
              "",
              "                inputCallbacks =",
              "                    object:",
              "                        ScrcpyInputSurfaceView.InputCallbacks {",
              "",
              "                        override fun handleKeyEvent(",
              "                            event: KeyEvent,",
              "                        ): Boolean {",
              "                            val handler =",
              "                                onImeKeyEvent",
              "                                    ?: return false",
              "",
              "                            taskScope.launch {",
              "                                imeInputMutex",
              "                                    .withLock {",
              "                                        handler(event)",
              "                                    }",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "",
              "                        override fun handleCommitText(",
              "                            text: CharSequence,",
              "                        ): Boolean {",
              "                            val handler =",
              "                                onImeCommitText",
              "                                    ?: return false",
              "",
              "                            taskScope.launch {",
              "                                imeInputMutex",
              "                                    .withLock {",
              "                                        handler(",
              "                                            text.toString()",
              "                                        )",
              "                                    }",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "",
              "                        override fun handleDeleteSurroundingText(",
              "                            beforeLength: Int,",
              "                            afterLength: Int,",
              "                        ): Boolean {",
              "                            val handler =",
              "                                onImeDeleteSurroundingText",
              "                                    ?: return false",
              "",
              "                            taskScope.launch {",
              "                                imeInputMutex",
              "                                    .withLock {",
              "                                        handler(",
              "                                            beforeLength,",
              "                                            afterLength,",
              "                                        )",
              "                                    }",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "                    }",
              "",
              "                surfaceTextureListener =",
              "                    object:",
              "                        TextureView.SurfaceTextureListener {",
              "",
              "                        override fun onSurfaceTextureAvailable(",
              "                            surfaceTexture: SurfaceTexture,",
              "                            width: Int,",
              "                            height: Int,",
              "                        ) {",
              "                            latestSession",
              "                                ?.let { info ->",
              "",
              "                                    if (",
              "                                        info.width > 0 &&",
              "                                        info.height > 0",
              "                                    ) {",
              "                                        surfaceTexture",
              "                                            .setDefaultBufferSize(",
              "                                                info.width,",
              "                                                info.height,",
              "                                            )",
              "                                    }",
              "                                }",
              "",
              "                            applyQuest3Transform()",
              "",
              "                            val newSurface =",
              "                                Surface(",
              "                                    surfaceTexture",
              "                                )",
              "",
              "                            currentSurface =",
              "                                newSurface",
              "",
              "                            if (latestSession != null) {",
              "                                scope.launch {",
              "                                    NativeCoreFacade",
              "                                        .attachVideoSurface(",
              "                                            newSurface",
              "                                        )",
              "                                }",
              "                            }",
              "                        }",
              "",
              "                        override fun onSurfaceTextureSizeChanged(",
              "                            surfaceTexture: SurfaceTexture,",
              "                            width: Int,",
              "                            height: Int,",
              "                        ) {",
              "                            applyQuest3Transform()",
              "                        }",
              "",
              "                        override fun onSurfaceTextureDestroyed(",
              "                            surfaceTexture: SurfaceTexture,",
              "                        ): Boolean {",
              "                            val surface =",
              "                                currentSurface",
              "",
              "                            if (surface != null) {",
              "                                taskScope.launch {",
              "                                    NativeCoreFacade",
              "                                        .detachVideoSurface(",
              "                                            surface",
              "                                        )",
              "",
              "                                    surface.release()",
              "                                }",
              "",
              "                                currentSurface = null",
              "                            }",
              "",
              "                            return true",
              "                        }",
              "",
              "                        override fun onSurfaceTextureUpdated(",
              "                            surfaceTexture: SurfaceTexture,",
              "                        ) = Unit",
              "                    }",
              "            }",
              "        },",
              "",
              "        update = { view ->",
              "            configureTexture(view)",
              "        },",
              "    )",
              "}",
          ]

          replacement = "\n".join(lines)

          s = (
              s[:start]
              + replacement
              + s[end:]
          )

          p.write_text(
              s,
              encoding="utf-8",
          )

          print(
              "TextureView renderer installed"
          )

      - name: Verify TextureView patch
        run: |
          echo "=== TextureView ==="

          grep -n "TextureView" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt

          echo "=== Quest transform ==="

          grep -n "applyQuest3Transform" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt

          echo "=== No rotation ==="

          if grep -n "postRotate" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/ScrcpyInputSurfaceView.kt
          then
            echo "Unexpected rotation found"
            exit 1
          fi

          echo "=== SurfaceTexture ==="

          grep -n "SurfaceTextureListener" \
            app/src/main/java/io/github/miuzarte/scrcpyforandroid/widgets/DeviceWidgets.kt

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          APK="$(
            find app/build/outputs \
              -type f \
              -name "*debug*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp \
            "$APK" \
            Quest3-ScrcpyForAndroid-V52.apk

          ls -lh \
            Quest3-ScrcpyForAndroid-V52.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-ScrcpyForAndroid-V52
          path: Quest3-ScrcpyForAndroid-V52.apk
          if-no-files-found: error
